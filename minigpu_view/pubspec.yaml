name: minigpu_view
description: Zero-copy Flutter rendering for minigpu SharedOutputTexture and miniav GPU buffers.
version: 1.5.10
environment:
  sdk: ^3.11.4
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  meta: ^1.16.0

  # Core minigpu — required for SharedOutputTexture adapter.
  minigpu: ^1.5.9
  minigpu_platform_interface: ^1.5.9

  # miniav — required for MiniAVBuffer adapter.
  #
  # NOT informational, whatever a previous comment here claimed. The path
  # override in pubspec_overrides.yaml applies to THIS repo only; a consumer
  # resolves against this constraint and nothing else. Leaving it at ^0.5.2
  # while miniav moved to 0.7.0 made this package the single blocker for
  # anything depending on both — and it was invisible in-repo, because the
  # override meant local builds never consulted the constraint at all.
  miniav: ^0.7.0

  # Used by web plugin only; pulled in unconditionally because Dart-only
  # web plugins cannot conditionally import native deps.
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.minigpu.view
        pluginClass: MinigpuViewPlugin
      windows:
        pluginClass: MinigpuViewPlugin
      macos:
        pluginClass: MinigpuViewPlugin
      ios:
        pluginClass: MinigpuViewPlugin
      linux:
        pluginClass: MinigpuViewPlugin
      web:
        pluginClass: MinigpuViewWebPlugin
        fileName: src/web/minigpu_view_web.dart
