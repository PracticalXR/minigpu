name: gpu_pipeline
description: A GPU-accelerated streaming pipeline for Dart and Flutter. Define directed stage graphs that route Tensors and host data through WGSL compute shaders with typed I/O ports, resource management, and real-time constraints.
version: 1.9.1
repository: https://github.com/PracticalXR/minigpu/tree/master/gpu_pipeline

environment:
  sdk: ^3.11.4

dependencies:
  gpu_tensor: ^1.9.0
  minigpu: ^1.9.0
  minigpu_web: ^1.9.0
  directed_graph: '>=0.3.9 <0.5.0'

dev_dependencies:
  lints: ^5.0.0
  test: ^1.29.0
  build_runner: ^2.7.2
  build_web_compilers: ^4.2.3
